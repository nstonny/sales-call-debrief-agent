name: Infra

# Manual only -- structural changes here can resize/relocate/delete a
# database or storage account, so this never runs on a push the way the app
# CD `deploy` job in ci.yml does. See infra/README.md for the bootstrap this
# depends on (resource group, App Registration, federated credential, role
# assignment -- all created once, by hand, before this workflow can run).
on:
  workflow_dispatch:
    inputs:
      whatIf:
        description: "Preview only (az deployment group what-if) instead of applying"
        type: boolean
        default: true

jobs:
  apply:
    name: ${{ inputs.whatIf && 'What-If preview' || 'Apply' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The template's image params default to a placeholder, and the app CD
      # job (ci.yml) owns the real tag. Without this, every apply/what-if
      # would reset api/ui/jobs to the placeholder. Read what's running now
      # and pass it back in; on a first deploy (resources don't exist yet)
      # the lookup is empty and the template's default applies.
      - name: Resolve running images
        run: |
          RG=rg-debrief-agent-prod
          API=$(az containerapp show -n ca-debrief-api -g "$RG" --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          UI=$(az containerapp show -n ca-debrief-ui -g "$RG" --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          JOBS=$(az containerapp job show -n caj-debrief-migrate -g "$RG" --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          echo "api=$API ui=$UI jobs=$JOBS"
          echo "IMAGE_PARAMS=${API:+apiImage=$API} ${UI:+uiImage=$UI} ${JOBS:+jobsImage=$JOBS}" >> "$GITHUB_ENV"

      - name: What-If preview
        if: ${{ inputs.whatIf }}
        run: |
          az deployment group what-if \
            --resource-group rg-debrief-agent-prod \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
                          openAiApiKey="${{ secrets.OPENAI_API_KEY }}" \
                          qdrantApiKey="${{ secrets.QDRANT_API_KEY }}" \
                          langfusePublicKey="${{ secrets.LANGFUSE_PUBLIC_KEY }}" \
                          langfuseSecretKey="${{ secrets.LANGFUSE_SECRET_KEY }}" \
                          langfuseBaseUrl="${{ secrets.LANGFUSE_BASE_URL }}" \
                          $IMAGE_PARAMS

      - name: Apply
        if: ${{ !inputs.whatIf }}
        run: |
          az deployment group create \
            --resource-group rg-debrief-agent-prod \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
                          openAiApiKey="${{ secrets.OPENAI_API_KEY }}" \
                          qdrantApiKey="${{ secrets.QDRANT_API_KEY }}" \
                          langfusePublicKey="${{ secrets.LANGFUSE_PUBLIC_KEY }}" \
                          langfuseSecretKey="${{ secrets.LANGFUSE_SECRET_KEY }}" \
                          langfuseBaseUrl="${{ secrets.LANGFUSE_BASE_URL }}" \
                          $IMAGE_PARAMS
