name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch cancels an in-flight run for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.10"
          python-version: "3.13"
          enable-cache: true

      # --frozen fails if uv.lock is out of date with pyproject.toml, which
      # catches a dependency added without relocking.
      - run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check src/ tests/

      - name: ruff format
        run: uv run ruff format --check src/ tests/

  test:
    name: Tests
    runs-on: ubuntu-latest

    # The suite stubs every external boundary and makes no network calls, but
    # importing debrief_agent reaches core/config.py, which raises at import time
    # when these are unset. They are placeholders and are never used to connect.
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      OPENAI_API_KEY: sk-not-a-real-key-tests-are-offline

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.10"
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --frozen

      - name: pytest
        run: uv run pytest -q --cov=debrief_agent --cov-report=term-missing

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guards the Dockerfile itself. Without this, a broken build would only be
      # discovered by whoever next ran `docker compose up`.
      - name: Build image
        run: docker build -t debrief:ci .

      - name: Package imports inside the image
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          OPENAI_API_KEY: sk-not-a-real-key-import-check-only
        run: |
          docker run --rm \
            -e DATABASE_URL -e OPENAI_API_KEY \
            debrief:ci python -c "
          from debrief_agent.app.main import app
          from debrief_agent.rag.agent import CallAnalyzer
          assert '/api/upload' in app.openapi()['paths']
          print('image OK:', CallAnalyzer.__module__)
          "
