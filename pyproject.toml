[project]
name = "sales-call-debrief-agent"
version = "0.1.0"
description = "LLM-powered pipeline for analyzing sales call transcripts and producing structured insights and CRM-ready outputs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "requests>=2.33.1",
    "streamlit>=1.56.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.16.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34.0",
    "openai>=1.75.0",
    "langfuse>=4.9.1,<5",
    "qdrant-client>=1.18.0",
    "langchain>=1.0.0",
    "langchain-qdrant>=1.1.0",
    "langchain-openai>=1.2.2",
    "langchain-community>=0.4.2",
    "pypdf>=6.12.2",
    "docx2txt>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.14",
    # Maintainer-only: used solely by the offline PDF -> markdown conversion
    # script, which is imported lazily and never reached by the api, ui,
    # migrate or seed paths. Kept out of the runtime image, which builds with
    # `uv sync --no-dev`, since it pulls magika -> onnxruntime + sympy (~120MB).
    "markitdown[pdf]>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults, which change between
# releases and would make CI results drift with the ruff version.
#   E,F   pycodestyle + pyflakes   I    import sorting
#   UP    pyupgrade                B    bugbear
#   SIM   simplifications          RUF  ruff-specific
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # line length is the formatter's job, not the linter's
    # En dashes in prose comments and error strings are intentional typography.
    "RUF001",
    "RUF002",
    "RUF003",
    # `class X(str, Enum)` -> `StrEnum` changes what str(member) returns, which
    # would alter serialization behaviour for a purely stylistic gain.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom deliberately calls these in argument
# defaults, so B008 is a false positive for them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
